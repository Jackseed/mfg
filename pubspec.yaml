name: magic
description: A new Flutter project.

publish_to: 'none'

version: 1.0.2+16

environment:
  sdk: ">=3.3.0 <5.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  auto_size_text: ^3.0.0
  cached_network_image: ^3.2.1
  chewie: ^1.7.1
  cloud_firestore: ^4.13.1
  dropdown_button2: ^2.3.9
  easy_debounce: ^2.0.1
  equatable: ^2.0.5
  firebase_analytics: ^10.7.4
  firebase_auth: ^4.15.2
  firebase_core: ^2.24.2
  firebase_crashlytics: ^3.4.8
  firebase_performance: ^0.9.3+8
  flutter_animate: ^4.1.1+1
  flutter_cache_manager: ^3.3.1
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.9
  font_awesome_flutter: ^10.6.0
  from_css_color: ^2.0.0
  go_router: ^7.1.1
  google_fonts: ^4.0.3
  google_sign_in: ^6.1.5
  intl: ^0.20.2
  json_path: ^0.6.2
  mime_type: ^1.0.0
  page_transition: ^2.1.0
  path_provider: ^2.0.14
  provider: ^6.0.5
  rive: ^0.12.2
  rxdart: ^0.27.7
  shared_preferences: ^2.2.2
  sign_in_with_apple: ^4.3.0
  smooth_page_indicator: ^1.1.0
  sqflite: ^2.2.6
  stream_transform: ^2.1.0
  timeago: ^3.2.2
  url_launcher: ^6.1.10
  video_player: ^2.8.1
  wakelock_plus: ^1.0.0

  cupertino_icons: ^1.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

  flutter_test:
    sdk: flutter


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: 'assets/images/app_launcher_icon.png'


flutter:

  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/lottie_animations/
    - assets/rive_animations/
    - assets/pdfs/
  fonts:
    - family: Mtg
      fonts:
        - asset: assets/fonts/mtg.ttf
    - family: Cards
      fonts:
        - asset: assets/fonts/cards.ttf
    - family: Crewmates
      fonts:
        - asset: assets/fonts/crewmates.ttf
    - family: Trophy
      fonts:
        - asset: assets/fonts/trophy.ttf
    - family: Counters
      fonts:
        - asset: assets/fonts/counters.ttf
    - family: Calendars
      fonts:
        - asset: assets/fonts/calendars.ttf
    - family: Refresh
      fonts:
        - asset: assets/fonts/refresh.ttf
    - family: Edit
      fonts:
        - asset: assets/fonts/edit.ttf
    - family: Centaur
      fonts:
        - asset: assets/fonts/centaur.ttf
